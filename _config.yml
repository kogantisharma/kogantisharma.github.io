# =============================================================================
# Sri Koganti | Senior Cloud & Platform Engineer
# Jekyll + So Simple Theme Configuration
# =============================================================================

# -----------------------------------------------
# SITE SETTINGS
# -----------------------------------------------
locale                   : "en-IE"
title                    : "Sri Koganti"
title_separator          : "|"
subtitle                 : "Senior Cloud & Platform Engineer"
name                     : "Sri Koganti"
description              : >-
  Senior Cloud Engineer in Cork, Ireland. 10+ years at Fidelity Investments and Forcepoint.
  AWS Solutions Architect & CKAD certified. Building toward MLOps and AI Engineering.
url                      : "https://kogantisharma.github.io"
baseurl                  : ""
repository               : "kogantisharma/kogantisharma.github.io"
words_per_minute         : 200

# -----------------------------------------------
# SEO
# -----------------------------------------------
google_site_verification :

social:
  type : Person
  name : Sri Koganti
  links:
    - "https://www.linkedin.com/in/srikoganti"
    - "https://github.com/kogantisharma"

# -----------------------------------------------
# SITE AUTHOR
# -----------------------------------------------
author:
  name     : "Sri Koganti"
  avatar   : "/assets/images/profile.jpg"
  bio      : >-
    Senior Cloud & Platform Engineer in Cork, Ireland.
    AWS SA · CKAD certified. Building toward MLOps and AI Engineering.
  location : "Cork, Ireland"
  links:
    - label : "LinkedIn"
      icon  : "fab fa-fw fa-linkedin"
      url   : "https://www.linkedin.com/in/srikoganti"
    - label : "GitHub"
      icon  : "fab fa-fw fa-github"
      url   : "https://github.com/kogantisharma"
    - label : "Download CV"
      icon  : "fas fa-fw fa-file-pdf"
      url   : "/assets/files/Sri_Koganti_CV.pdf"

# -----------------------------------------------
# THEME
# -----------------------------------------------
remote_theme : "mmistakes/so-simple-theme@3.2.0"
skin         : "/assets/css/skins/default.css"

# -----------------------------------------------
# READING FILES
# -----------------------------------------------
include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile.lock
  - CHANGELOG
  - LICENSE
  - README
  - tmp

keep_files:
  - .git

encoding        : "utf-8"
markdown_ext    : "markdown,mkdown,mkdn,mkd,md"

# -----------------------------------------------
# CONVERSION
# -----------------------------------------------
markdown    : kramdown
highlighter : rouge
lsi         : false
excerpt_separator : "\n\n"
incremental : false

kramdown:
  input           : GFM
  hard_wrap       : false
  auto_ids        : true
  footnote_nr     : 1
  entity_output   : as_char
  toc_levels      : 1..6
  smart_quotes    : lsquo,rsquo,ldquo,rdquo
  enable_coderay  : false

# -----------------------------------------------
# SASS / SCSS
# -----------------------------------------------
sass:
  sass_dir : _sass
  style    : compressed

# -----------------------------------------------
# OUTPUTTING
# -----------------------------------------------
permalink   : /:categories/:title/
paginate    : 6
paginate_path : /blog/page:num/
timezone    : "Europe/Dublin"

# -----------------------------------------------
# PLUGINS
# -----------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

whitelist:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# -----------------------------------------------
# COLLECTIONS
# -----------------------------------------------
collections:
  projects:
    output    : true
    permalink : /projects/:path/

# -----------------------------------------------
# DEFAULTS
# -----------------------------------------------
defaults:
  # _posts
  - scope:
      path : ""
      type : posts
    values:
      layout    : post
      show_date : true

  # _pages
  - scope:
      path : "_pages"
      type : pages
    values:
      layout : page

  # _projects
  - scope:
      path : ""
      type : projects
    values:
      layout : page
      toc    : true

# -----------------------------------------------
# ANALYTICS (enable when ready)
# -----------------------------------------------
# google_analytics : "G-XXXXXXXXXX"
