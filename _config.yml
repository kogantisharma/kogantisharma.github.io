title: "Sri Koganti"
description: "Senior Cloud and Platform Engineer in Cork, Ireland. AWS SAA and CKAD certified, supporting large-scale enterprise platforms and building production-grade MLOps and AI systems."
url: "https://kogantisharma.github.io"
baseurl: ""
repository: "kogantisharma/kogantisharma.github.io"
author: "Sri Koganti"

theme: jekyll-theme-cayman

include:
  - _pages

exclude:
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - Gemfile.lock
  - README.md
  - tmp

encoding: "utf-8"
timezone: "Europe/Dublin"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
