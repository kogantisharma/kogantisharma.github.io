title: "Sri Koganti"
description: "Senior Cloud Engineer - Cork, Ireland. AWS SA & CKAD certified. 10+ years at Fidelity Investments and Forcepoint. Building toward MLOps & AI Engineering."
url: "https://kogantisharma.github.io"
baseurl: ""
repository: "kogantisharma/kogantisharma.github.io"

remote_theme: "vidhyav656/startbootstrap-stylish-portfolio-jekyll"
author: "Sri Koganti"

include:
  - _pages

exclude:
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - Gemfile.lock
  - README.md
  - tmp

encoding: "utf-8"
timezone: "Europe/Dublin"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
